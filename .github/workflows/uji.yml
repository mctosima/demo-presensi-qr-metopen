# Menjalankan seluruh uji setiap ada push atau pull request.
name: uji

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6          # 1. ambil kode repositori
      - uses: actions/setup-python@v6      # 2. siapkan Python
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt   # 3. pasang pytest
      - run: pytest                                # 4. jalankan semua uji
